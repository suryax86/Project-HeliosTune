name: Android CI Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Ensure Valid Gradle Wrapper
      run: |
        if ! java -jar gradle/wrapper/gradle-wrapper.jar --version > /dev/null 2>&1; then
          echo "Gradle wrapper JAR is corrupted or missing. Regenerating..."
          gradle wrapper --gradle-version 8.7
        fi
        chmod +x gradlew || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Decode Keystore from Secrets
      if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks

    - name: Build Signed Release APK
      if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      env:
        KEYSTORE_PATH: app/release-keystore.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        ./gradlew assembleRelease --stacktrace

    - name: Clean up Keystore File
      if: always()
      run: rm -f app/release-keystore.jks

    - name: Upload Release APK Artifact
      if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
